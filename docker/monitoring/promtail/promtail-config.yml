server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 后端 API 日志
  - job_name: backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend
          env: production
          __path__: /var/log/backend/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            time: time
            msg: msg
            requestId: requestId
            userId: userId
            method: method
            url: url
            status: status
            duration: duration
      - labels:
          level:
          method:
          status:
      - timestamp:
          source: time
          format: RFC3339Nano

  # 前端应用日志
  - job_name: frontend
    static_configs:
      - targets:
          - localhost
        labels:
          job: frontend
          env: production
          __path__: /var/log/frontend/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            time: time
            msg: msg
            error: error
            stack: stack
      - labels:
          level:
      - timestamp:
          source: time
          format: RFC3339Nano

  # Docker 容器日志
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service

  # PostgreSQL 日志
  - job_name: postgres
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgres
          __path__: /var/log/postgresql/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+ \w+) \[(?P<pid>\d+)\] (?P<level>\w+):\s+(?P<msg>.*)$'
      - labels:
          level:
          pid:
      - timestamp:
          source: time
          format: '2006-01-02 15:04:05.000 MST'

  # Nginx 日志（如果使用）
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/nginx/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>[\d\.]+) - (?P<remote_user>\S+) \[(?P<time>[^\]]+)\] "(?P<method>\w+) (?P<path>\S+) (?P<protocol>\S+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)" (?P<request_time>\d+\.\d+)'
      - labels:
          method:
          status:
      - timestamp:
          source: time
          format: '02/Jan/2006:15:04:05 -0700'
