name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  # 从 env.yml 继承环境变量
  CACHE_VERSION: 'v1'

jobs:
  # 准备发布
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.event.release.tag_name }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"
          
      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          
      - name: Get upload URL
        if: github.event_name == 'release'
        id: get_upload_url
        run: |
          echo "upload_url=${{ github.event.release.upload_url }}" >> $GITHUB_OUTPUT
          
  # 构建桌面应用 - Windows
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: prepare
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
        
      - name: Build Tauri app (Windows)
        working-directory: src/frontend
        run: npm run tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v3
        with:
          name: windows-build
          path: |
            src/frontend/src-tauri/target/release/bundle/msi/*.msi
            src/frontend/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          
      - name: Upload to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.prepare.outputs.upload_url }}
          asset_path: src/frontend/src-tauri/target/release/bundle/msi/novel-writing-software_${{ needs.prepare.outputs.version }}_x64.msi
          asset_name: novel-writing-software-${{ needs.prepare.outputs.version }}-windows-x64.msi
          asset_content_type: application/octet-stream
          
  # 构建桌面应用 - macOS
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: prepare
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
        
      - name: Build Tauri app (macOS)
        working-directory: src/frontend
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v3
        with:
          name: macos-build
          path: |
            src/frontend/src-tauri/target/release/bundle/dmg/*.dmg
            src/frontend/src-tauri/target/release/bundle/macos/*.app
          retention-days: 30
          
      - name: Upload to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.prepare.outputs.upload_url }}
          asset_path: src/frontend/src-tauri/target/release/bundle/dmg/novel-writing-software_${{ needs.prepare.outputs.version }}_universal.dmg
          asset_name: novel-writing-software-${{ needs.prepare.outputs.version }}-macos-universal.dmg
          asset_content_type: application/octet-stream
          
  # 构建桌面应用 - Linux
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: prepare
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          
      - name: Install Tauri dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
          
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
        
      - name: Build Tauri app (Linux)
        working-directory: src/frontend
        run: npm run tauri build -- --bundles deb,appimage
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v3
        with:
          name: linux-build
          path: |
            src/frontend/src-tauri/target/release/bundle/deb/*.deb
            src/frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30
          
      - name: Upload to Release (DEB)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.prepare.outputs.upload_url }}
          asset_path: src/frontend/src-tauri/target/release/bundle/deb/novel-writing-software_${{ needs.prepare.outputs.version }}_amd64.deb
          asset_name: novel-writing-software-${{ needs.prepare.outputs.version }}-linux-amd64.deb
          asset_content_type: application/vnd.debian.binary-package
          
      - name: Upload to Release (AppImage)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.prepare.outputs.upload_url }}
          asset_path: src/frontend/src-tauri/target/release/bundle/appimage/novel-writing-software_${{ needs.prepare.outputs.version }}_amd64.AppImage
          asset_name: novel-writing-software-${{ needs.prepare.outputs.version }}-linux-amd64.AppImage
          asset_content_type: application/octet-stream
          
  # 构建 Docker 镜像
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            VERSION=${{ needs.prepare.outputs.version }}
            
      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          
  # 发布完成通知
  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux, build-docker]
    if: always()
    
    steps:
      - name: Send success notification
        if: success()
        run: |
          echo "✅ Release ${{ needs.prepare.outputs.version }} completed successfully!"
          echo "- Windows: novel-writing-software-${{ needs.prepare.outputs.version }}-windows-x64.msi"
          echo "- macOS: novel-writing-software-${{ needs.prepare.outputs.version }}-macos-universal.dmg"
          echo "- Linux: novel-writing-software-${{ needs.prepare.outputs.version }}-linux-amd64.deb"
          echo "- Linux: novel-writing-software-${{ needs.prepare.outputs.version }}-linux-amd64.AppImage"
          echo "- Docker: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ needs.prepare.outputs.version }}"
          
      - name: Send failure notification
        if: failure()
        run: |
          echo "❌ Release ${{ needs.prepare.outputs.version }} failed!"
          exit 1
