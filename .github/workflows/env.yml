# 共享环境变量配置
# 注意：敏感信息请使用 GitHub Secrets，不要在此文件中硬编码

name: Shared Environment Variables

env:
  # Node.js 版本
  NODE_VERSION: '18'
  
  # Rust 版本（用于 Tauri）
  RUST_VERSION: 'stable'
  
  # 项目配置
  PROJECT_NAME: 'novel-writing-software'
  
  # Docker 配置
  DOCKER_REGISTRY: 'ghcr.io'
  DOCKER_IMAGE_NAME: ${{ github.repository }}
  
  # 构建配置
  BUILD_TYPE: 'production'
  
  # 测试配置
  TEST_COVERAGE_THRESHOLD: '80'
  
  # 缓存版本（修改此值可强制刷新缓存）
  CACHE_VERSION: 'v1'
